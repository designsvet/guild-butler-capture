# Packaging groundwork (Phase 3 finishes this: signing, notarization, updates).
# Unsigned local builds work today via `pnpm package:mac` / `pnpm package:win`.
#
# Icons live in `resources/icons/` and are BUILD inputs, not shipped files:
# electron-builder bakes the .icns into the .app bundle and the .ico into the
# .exe, so neither needs to be in `files:` — adding them would put 3 MB of art
# inside every build for nothing. Runtime `BrowserWindow({icon})` is likewise
# unnecessary: macOS reads the dock icon from the bundle and Windows reads the
# window/taskbar icon from the executable.
#
# Bundling the engine: the Windows CI workflow (.github/workflows/
# capture-windows.yml in the raid-bot repo while staged) assembles an
# `engine-dist/` folder — tools/prepare-engine-dist.mjs over an engine
# checkout whose `cap` was rebuilt for this app's Electron ABI — and builds
# with `--config electron-builder.win-ci.yml` (extends this file + adds the
# engine as extraResources), so local builds without an engine-dist keep
# working unchanged. The locator prefers <resources>/engine in packaged
# builds and captures into the user's data dir (the install dir is
# read-only; the engine writes to cwd).
#
# Npcap is deliberately NOT bundled: redistribution needs the paid OEM licence,
# so the app links members to the official installer instead.

appId: com.guildbutler.capture
productName: Guild Butler Capture

directories:
  output: release

files:
  - dist/**/*
  - tools/mock-engine.cjs
  - package.json

# The app itself has no native modules — the engine child carries them.
npmRebuild: false

mac:
  category: public.app-category.utilities
  icon: resources/icons/icon.icns
  target:
    - dmg
    - zip
  # Phase 3: hardenedRuntime + notarization once the Developer ID cert is wired.
  extraResources:
    - from: resources/mac
      to: mac

win:
  icon: resources/icons/icon.ico
  target:
    - nsis
  # Space-free so the GitHub asset name matches latest.yml byte-for-byte —
  # GitHub rewrites spaces in asset names to dots, and electron-updater must
  # find the file under exactly the name the manifest promises. The stable
  # `GuildButlerCapture-Setup.exe` copy (the download page's pin) is unchanged.
  artifactName: GuildButlerCapture-Setup-${version}.${ext}

# One-click per-user install (LocalAppData): no admin prompt for guildmates,
# and the install dir is per-user — the bundled engine still never writes
# there (captures go to the user's data dir).
nsis:
  oneClick: true
  perMachine: false
  # Named explicitly rather than left to default from `win.icon`: the installer
  # and the Add/Remove Programs entry are the two places a member sees the mark
  # before the app ever opens.
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico

# Auto-update (Phase 3, Windows slice): electron-updater reads this at BUILD
# time — it embeds app-update.yml into the installed app and emits latest.yml
# beside the installer. CI still publishes via action-gh-release (the build
# runs with --publish never), so this never uploads anything by itself.
publish:
  provider: github
  owner: designsvet
  repo: guild-butler-capture
