name: ci

on:
  push:
    branches: [main]
  pull_request:

# This workflow only builds and tests; it never writes to the repo. Declared
# explicitly rather than inherited, so it does not silently gain whatever the
# repository default becomes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
