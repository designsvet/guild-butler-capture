name: ci

on:
  push:
    branches: [main]
  pull_request:

# This workflow only builds and tests; it never writes to the repo. Declared
# explicitly rather than inherited, so it does not silently gain whatever the
# repository default becomes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Every state at the fixed 660x620, in the built renderer (tools/layout-check.cjs).
      - run: xvfb-run -a pnpm check:layout
      # The v5 shell: every route at 768/1024/1280/1440, both themes, six languages, every state
      # that changes the layout, both platforms (tools/shell-layout-check.cjs).
      - run: xvfb-run -a pnpm check:layout:v5
