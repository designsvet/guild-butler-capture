# Guild Butler Capture — the release build (ADR 0096).
#
# (Was `windows.yml` / `capture-windows` until 2026-08-28, when the macOS job
# joined it and the old name stopped being true.)
#
# Two jobs: `build` produces the Windows installer AND owns every release
# decision (tag, publish, retry); `macos` then attaches a DMG to
# the release `build` just published.
#
# Why the mac work is a JOB here and not a workflow of its own: a release cut
# with GITHUB_TOKEN does NOT trigger further workflow runs, so an
# `on: release: [published]` mac workflow would never fire — green, silent, and
# wrong. `needs: build` gives the same ordering and cannot be fooled. It also
# degrades the right way: if the mac build breaks, the release still carries
# the Windows installer.
#
# Produces an UNSIGNED nsis installer with the engine BUNDLED (cap compiled
# for the app's Electron ABI on this runner; cap vendors its own WinPcap SDK,
# so no external SDK download). The artifact is for the guild's own testing;
# distribution beyond that waits for the public repo (GPL source-offer —
# owner's call, see ADR 0096). Npcap itself is never bundled (paid OEM
# licence) — testers install it from npcap.com; the app explains this.
#
# Triggers:
# - workflow_dispatch: build-only unless release_version is explicitly supplied
#   on release/0.8.x after release approval.
# - pull_request touching THIS file — so the pipeline can be exercised from
#   the PR before it merges (runs with the defaults below).
#
# Public 0.8.9 maintenance build: use the reviewed immutable engine in
# resources/engine-lock.json. PR runs only create CI artifacts; publishing
# remains an explicitly authorized release_version dispatch after review.

name: capture-build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish the reviewed package.json version (blank = build only)"
        type: string
        default: ""
  pull_request:

permissions:
  contents: write

jobs:
  build:
    outputs:
      # Maintenance releases build the reviewed version already in package.json.
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    # This job needs a WINDOWS runner, so it cannot ride the self-hosted
    # `raid-bot` label; it gets its own kill-switch variable in the house
    # pattern (test/ciWorkflow.test.ts): set repo var CI_RUNS_ON_WINDOWS to
    # repoint it (e.g. to a self-hosted Windows box) with no PR.
    #
    # Default pinned to windows-2022, not windows-latest: since 2026-06 the
    # latest image ships Visual Studio 2026 (internal v18), which node-gyp
    # < 12.1 and @electron/rebuild's gyp fork cannot detect ("unknown version
    # \"undefined\"" — the maiden run failed exactly there). windows-2022
    # carries VS2022 and stays supported; unpin once the toolchain knows VS 18.
    runs-on: ${{ vars.CI_RUNS_ON_WINDOWS || 'windows-2022' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Read the reviewed engine lock
        id: engine-lock
        run: node tools/read-engine-lock.cjs >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.engine-lock.outputs.repository }}
          ref: ${{ steps.engine-lock.outputs.commit }}
          path: engine-src

      # House rule (test/ciWorkflow.test.ts): pnpm/action-setup BEFORE
      # setup-node, with a per-runner dest.
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # PRs are build-only. Only an explicit dispatch of the reviewed maintenance
      # branch can publish; this workflow never bumps or pushes main.
      - name: Decide the release tag
        id: rel
        env:
          REQUESTED: ${{ inputs.release_version }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "${REQUESTED:-}" ]; then
            if [ "$EVENT" != "workflow_dispatch" ] || [ "$REF" != "refs/heads/release/0.8.x" ]; then
              echo "::error::publish only by explicit dispatch of release/0.8.x"; exit 1
            fi
            VERSION=$(node -p "require('./package.json').version")
            if [ "$REQUESTED" != "$VERSION" ]; then
              echo "::error::release_version must match the reviewed package.json"; exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply engine patches (idempotent — the owner's branch may already carry them)
        run: |
          cd engine-src
          for p in ../resources/engine-patches/*.patch; do
            if git apply --check "$p" 2>/dev/null; then
              echo "applying $p"
              git apply "$p"
            elif git apply --reverse --check "$p" 2>/dev/null; then
              echo "skipping $p — already applied on this engine ref"
            else
              echo "::error::$p neither applies nor is already applied on this engine ref"
              exit 1
            fi
          done

      - name: Install engine deps (no compile — cap is built once, for Electron's ABI, below)
        run: cd engine-src && npm install --omit=dev --ignore-scripts

      - name: Test the repaired engine
        run: cd engine-src && node --test test/*.test.js

      - name: Install app deps
        run: pnpm install --frozen-lockfile

      - name: Rebuild cap for the app's Electron ABI
        run: node tools/engine-rebuild.mjs engine-src

      - name: Assemble engine-dist
        run: node tools/prepare-engine-dist.mjs engine-src engine-dist

      - name: Verify the assembled decoder
        run: node tools/verify-engine-protocol.cjs engine-dist

      - name: Build the installer (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm build
          # electron-builder fetches the ~100 MB Electron zip from GitHub's
          # release CDN on every run, uncached, and a 504 from that CDN kills
          # the whole packaging step — it happened on this PR with every line
          # of the build itself already green. app-builder does not retry a
          # 5xx, so retry the pack: three attempts, backing off, and the third
          # failure is a real one.
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --win --config electron-builder.win-ci.yml --publish never; then
              exit 0
            fi
            echo "::warning::electron-builder attempt $attempt failed (usually the Electron download). Retrying."
            sleep $((attempt * 20))
          done
          echo "::error::electron-builder failed three times — this is not a flaky download."
          exit 1

      - name: Verify the packaged Windows engine and native binding
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: '"release/win-unpacked/Guild Butler Capture.exe" tools/verify-engine-protocol.cjs release/win-unpacked/resources/engine --native'

      - name: Update manifest exists (electron-updater reads this from the release)
        # A hard gate, not a glob: upload-artifact's if-no-files-found only
        # fires when NOTHING matches, so a missing latest.yml beside a present
        # .exe would ride through silently — and auto-update would be dead on
        # arrival with every other signal green. cat shows the manifest, so
        # every run displays the exact fileName/version/sha512 the updater
        # will be promised.
        run: |
          test -f release/latest.yml
          cat release/latest.yml
          node -e "const fs=require('fs'); const v=require('./package.json').version; if (!fs.readFileSync('release/latest.yml','utf8').split(/\r?\n/).includes('version: '+v)) throw Error('updater version mismatch')"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: guild-butler-capture-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
          # v4 artifacts are immutable per run: without this, a job RE-RUN
          # dies right here on a name conflict, before the release step it
          # was rerun for. The rerun's rebuild supersedes the first file.
          overwrite: true

      - name: Stable-named copy — the download page's /latest/download URL
        if: steps.rel.outputs.tag != ''
        run: cp release/*.exe "release/GuildButlerCapture-Setup.exe"

      # action-gh-release publishes draft-first: create a draft → upload
      # assets → publish (publishing is what creates the tag). So a network
      # drop mid-upload fails the job with an invisible tagless DRAFT
      # stranded and nothing served to updaters — latest.yml can never point
      # at a missing asset, an ordering we rely on. Remove draft debris before
      # an explicitly requested retry. Published releases are never deleted.
      # Published releases are never touched — drafts only.
      - name: Drop stale draft releases of this tag
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | select(.draft and .tag_name == env.TAG) | .id'); do
            echo "deleting stale draft release $id (tag_name $TAG)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      - name: Publish GitHub Release
        id: publish1
        if: steps.rel.outputs.tag != ''
        # One severed upload must not strand the whole release — the steps
        # below retry once from a clean slate. Both attempts failing fails
        # the job, so a real breakage still shows red.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          # action-gh-release creates the tag itself at target_commitish, so
          # cutting a release never needs a tag push.
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/latest.yml
          generate_release_notes: true

      - name: Drop the severed draft before retrying
        if: steps.rel.outputs.tag != '' && steps.publish1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | select(.draft and .tag_name == env.TAG) | .id'); do
            echo "deleting severed draft release $id (tag_name $TAG)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      - name: Publish GitHub Release (retry after a severed upload)
        if: steps.rel.outputs.tag != '' && steps.publish1.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/latest.yml
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # macOS: same engine bundling, DMG instead of an installer, attached to the
  # release the `build` job has already published.
  # ---------------------------------------------------------------------------
  macos:
    needs: build
    # Apple Silicon (macos-14 and later are arm64). Intel Macs get no build:
    # a universal binary would need the engine's `cap` native module built for
    # both arches on one runner, and cross-compiling a libpcap binding is a
    # bigger job than the shrinking audience justifies. Same kill-switch
    # pattern as the Windows job — repoint with a repo var, no PR.
    runs-on: ${{ vars.CI_RUNS_ON_MACOS || 'macos-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          # Both platforms package the same reviewed app commit.
          ref: ${{ github.sha }}

      - name: Read the reviewed engine lock
        id: engine-lock
        run: node tools/read-engine-lock.cjs >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.engine-lock.outputs.repository }}
          ref: ${{ steps.engine-lock.outputs.commit }}
          path: engine-src

      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply engine patches (idempotent — the owner's branch may already carry them)
        run: |
          cd engine-src
          for p in ../resources/engine-patches/*.patch; do
            if git apply --check "$p" 2>/dev/null; then
              echo "applying $p"
              git apply "$p"
            elif git apply --reverse --check "$p" 2>/dev/null; then
              echo "skipping $p — already applied on this engine ref"
            else
              echo "::error::$p neither applies nor is already applied on this engine ref"
              exit 1
            fi
          done

      - name: Install engine deps (no compile — cap is built once, for Electron's ABI, below)
        run: cd engine-src && npm install --omit=dev --ignore-scripts

      - name: Test the repaired engine
        run: cd engine-src && node --test test/*.test.js

      - name: Install app deps
        run: pnpm install --frozen-lockfile

      # macOS ships libpcap, so cap needs no vendored SDK here — the Windows
      # job's one platform difference.
      - name: Rebuild cap for the app's Electron ABI
        run: node tools/engine-rebuild.mjs engine-src

      - name: Assemble engine-dist
        run: node tools/prepare-engine-dist.mjs engine-src engine-dist

      - name: Verify the assembled decoder
        run: node tools/verify-engine-protocol.cjs engine-dist

      # Decide, once, whether this build can be signed and notarized, and
      # write the credentials out as environment for the steps that follow.
      #
      # All-or-nothing is not tidiness, it is required: electron-builder's
      # getNotarizeOptions THROWS when some of APPLE_API_KEY / _KEY_ID /
      # _ISSUER are set and others are not, so a half-configured repo would
      # fail the build rather than fall back. Deciding here means the build
      # step below never sees a partial set.
      #
      # The signing secrets are absent by default, and everything downstream
      # degrades to exactly the previous behaviour: ad-hoc signed, not
      # notarized, green. That is deliberate — a fork, or this repo before
      # the certificate is added, must still produce a usable build.
      - name: Decide whether this build is signed
        id: apple
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "No MAC_CSC_LINK secret: building ad-hoc signed and not notarized."
            echo "Members will need right-click -> Open on first launch."
            exit 0
          fi
          echo "signing=true" >> "$GITHUB_OUTPUT"

          # Exported here rather than in the build step's env: block, and that
          # is the whole point. `CSC_LINK: ${{ secrets.X }}` with no secret set
          # does not leave the variable unset, it sets it to the EMPTY STRING --
          # and app-builder-lib treats empty as a real value on purpose:
          #
          #   getCscLink() { // allow to specify as empty string
          #     ... chooseNotNull(config.cscLink, process.env.CSC_LINK) }
          #   chooseNotNull = (v1, v2) => v1 == null ? v2 : v1
          #
          # "" is not null, so it survives, the `cscLink == null` guard never
          # fires, and electron-builder tries to import a certificate from ""
          # -- resolved against the project dir, which fails as
          # "<repo root> not a file". Writing the vars only when they are real
          # means the unsigned path has no CSC_LINK at all.
          # Newlines are stripped so a wrapped base64 paste stays one line.
          {
            echo "CSC_LINK=$(printf '%s' "$CSC_LINK" | tr -d '\n\r ')"
            echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD:-}"
          } >> "$GITHUB_ENV"

          if [ -n "${APPLE_API_KEY_B64:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] \
             && [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            # A .p8 that is not a private key means a mangled secret; catch it
            # here rather than 20 minutes later inside notarytool.
            head -1 "$RUNNER_TEMP/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "Signing with a Developer ID and notarizing."
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAC_CSC_LINK is set but the notarization secrets are not (need APPLE_API_KEY_B64, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_TEAM_ID). The app will be Developer ID signed but NOT notarized, and Gatekeeper still refuses it."
          fi

      # `--mac dmg` picks the target on the CLI rather than overriding
      # mac.target in the overlay: `extends` concatenates arrays, so a config
      # override would have produced [dmg, zip, dmg] and built the same disk
      # image twice. The base config's zip target exists for electron-updater's
      # mac feed, which is off by construction (updateController gates on
      # win32 — electron-updater cannot update an unsigned app), so there is
      # nothing to spend runner minutes on.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY is the whole switch: "false" makes
      # findIdentity return null without touching the keychain, so the build
      # falls through to the afterPack hook's ad-hoc signature. The notarize
      # vars are already in the environment from the step above, or entirely
      # absent — electron-builder skips notarization silently when it finds
      # none of them.
      - name: Build the DMG
        env:
          # CSC_LINK / CSC_KEY_PASSWORD deliberately absent: the decide step
          # puts them in the environment only when a certificate really exists.
          # Setting them here would define them as "" on every unsigned build,
          # which is what broke the macOS job on main for four merges.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.apple.outputs.signing }}
        run: |
          pnpm build
          # electron-builder fetches the ~100 MB Electron zip from GitHub's
          # release CDN on every run, uncached, and a 504 from that CDN kills
          # the whole packaging step — it happened on this PR with every line
          # of the build itself already green. app-builder does not retry a
          # 5xx, so retry the pack: three attempts, backing off, and the third
          # failure is a real one.
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --mac dmg --arm64 --config electron-builder.mac-ci.yml --publish never; then
              exit 0
            fi
            echo "::warning::electron-builder attempt $attempt failed (usually the Electron download). Retrying."
            sleep $((attempt * 20))
          done
          echo "::error::electron-builder failed three times — this is not a flaky download."
          exit 1

      # The engine is the whole point of the bundle, and a missing one fails
      # nothing at build time — the app would just fall back to "no engine
      # found" on a member's Mac. Assert it landed inside the .app, the way
      # the Windows job asserts latest.yml exists.
      - name: Verify the packaged Mac engine and native binding
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          APP=$(ls -d release/mac*/*.app | head -1)
          "$APP/Contents/MacOS/Guild Butler Capture" tools/verify-engine-protocol.cjs "$APP/Contents/Resources/engine" --native

      - name: The engine is inside the bundle, and the bundle is signed
        # The signature check is here as well as inside the afterPack hook
        # because this is the assertion a reader of a red build sees. The
        # bundle shipped UNSIGNED for its first two builds -- `identity: null`
        # skips signing rather than requesting an ad-hoc signature, and
        # nothing read the result -- so "did anything actually sign this?"
        # earns a line of its own. `codesign -dv` prints the authority, which
        # reads "Signature=adhoc" on an unsigned build and names the Developer
        # ID on a signed one.
        run: |
          APP=$(ls -d release/mac*/*.app | head -1)
          echo "checking $APP"
          test -f "$APP/Contents/Resources/engine/src/index.js"
          test -d "$APP/Contents/Resources/engine/node_modules/cap"
          test -f "$APP/Contents/Resources/mac/install-bpf-helper.sh"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1
          ls -la release/*.dmg

      # The only check that answers the question a member actually has: will
      # this open without a fight? spctl is Gatekeeper's own assessment, and
      # it passes only for a Developer ID signature WITH a notarization
      # ticket -- signing alone does not satisfy it. Asserted rather than
      # printed, because a signed-but-rejected build looks identical to a
      # good one in every other line of this log.
      - name: Gatekeeper accepts the app
        if: steps.apple.outputs.notarize == 'true'
        run: |
          APP=$(ls -d release/mac*/*.app | head -1)
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      # electron-builder notarizes and staples the .app during packing, before
      # the disk image exists, so the DMG members actually download is signed
      # but carries no ticket of its own. Gatekeeper checks the downloaded
      # DMG, so without this it refuses the file even though the app inside is
      # notarized. `--wait` blocks until Apple answers; a rejection fails the
      # job, which is the point -- shipping an unnotarized DMG that claims to
      # be notarized is worse than not signing at all.
      - name: Notarize and staple the DMG
        if: steps.apple.outputs.notarize == 'true'
        run: |
          DMG=$(ls release/*.dmg | head -1)
          echo "notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: guild-butler-capture-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      # Attach to the release `build` published. `gh release upload` rather
      # than a second action-gh-release: the release already exists, and a
      # second publisher is how two jobs end up racing over one tag.
      # --clobber keeps a job re-run idempotent.
      - name: Attach the DMG to the release
        if: needs.build.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cp release/*.dmg "release/GuildButlerCapture.dmg"
          gh release upload "$TAG" release/*.dmg --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
