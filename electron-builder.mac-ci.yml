# CI overlay for the macOS build (the `macos` job in .github/workflows/
# windows.yml): the base config plus the bundled engine. A separate file for
# the same two reasons as the Windows overlay — electron-builder's dotted CLI
# flags cannot express an array element, and local `pnpm package:mac` must
# keep working with no engine-dist/ present.
extends: ./electron-builder.yml

mac:
  # BOTH entries, deliberately. electron-builder lets a platform block
  # OVERRIDE the top-level `extraResources` rather than add to it, so the
  # Windows overlay's top-level form would silently drop the base config's
  # `mac.extraResources` (the BPF helper scripts) here — the app would ship
  # without the one-prompt permission fix and nothing would fail the build.
  extraResources:
    - from: resources/mac
      to: mac
    - from: engine-dist
      to: engine

  # DMG only. The base config also builds a zip, which exists for
  # electron-updater's mac feed — and mac auto-update is off by construction
  # (`updateController.ts` gates on `win32`, because electron-updater cannot
  # update an app that is not Developer-ID signed). Building it would spend
  # runner minutes on a file nobody can use.
  target:
    - dmg

  # No Developer ID yet (open question Q16), so: no real signing, and
  # `identity: null` so electron-builder still AD-HOC signs. That is not a
  # nicety on Apple Silicon — an arm64 binary with no signature at all will
  # not launch. Ad-hoc signed is launchable, and Gatekeeper still shows the
  # unidentified-developer prompt the download page walks members through.
  identity: null
