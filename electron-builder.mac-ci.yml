# CI overlay for the macOS build (the `macos` job in .github/workflows/
# build.yml): the base config plus the bundled engine. A separate file for the
# same two reasons as the Windows overlay — electron-builder's dotted CLI
# flags cannot express an array element, and local `pnpm package:mac` must
# keep working with no engine-dist/ present.
#
# ONLY the engine is listed here, and that is load-bearing. `extends`
# CONCATENATES arrays rather than replacing them, so naming `resources/mac`
# again (which the base config already has under mac.extraResources) put the
# same entry in the list twice and the second copy died on
# `EEXIST … link resources/mac/fix-bpf.sh` — the first real macOS run, and a
# Linux `--dir` dry run does not reproduce it, because the copier only hard
# links when it can. The `macos` job asserts BOTH the engine and the BPF
# helper are inside the built .app, which is what turns a wrong guess about
# this merge into a failed build instead of an app that silently ships
# without one of them.
extends: ./electron-builder.yml

mac:
  extraResources:
    - from: engine-dist
      to: engine

  # SIGNING IS DECIDED BY THE ENVIRONMENT, NOT BY THIS FILE.
  #
  # `identity` used to be pinned to null here, which does NOT mean "sign
  # ad-hoc" -- app-builder-lib reads it and skips signing outright, and it
  # skips it whether or not a real certificate is available. That made a
  # signed build impossible to reach from this config, so the key is gone and
  # the decision moved to the one place that knows whether a certificate
  # exists: the workflow, via CSC_IDENTITY_AUTO_DISCOVERY.
  #
  #   no MAC_CSC_LINK secret -> CSC_IDENTITY_AUTO_DISCOVERY=false. findIdentity
  #     returns null without consulting the keychain, signing is skipped with a
  #     warning, and the afterPack hook's ad-hoc signature is what ships.
  #   MAC_CSC_LINK present -> auto-discovery on. electron-builder imports the
  #     .p12 into a temporary keychain, finds the Developer ID, signs every
  #     nested Mach-O with the hardened runtime (its default for non-MAS mac
  #     builds), and notarizes if the API-key vars are also set.
  #
  # Note that PULL REQUEST builds never sign, whatever the secrets say --
  # macCodeSign's isSignAllowed() refuses on PRs unless CSC_FOR_PULL_REQUEST
  # is set. So the signed path can only be exercised by a push to main, and a
  # PR build is always the ad-hoc one.

# Sign the disk image too, not just the app inside it. Off by default in
# electron-builder (the check is `sign === true`), and it degrades on its own
# when there is no certificate: signDmg looks for a Developer ID, then a Mac
# Developer identity, and returns quietly if it finds neither.
#
# electron-builder does NOT notarize the DMG -- it notarizes and staples the
# .app during packing, before the disk image exists -- so the workflow
# notarizes and staples the DMG itself afterwards. A signed but un-notarized
# DMG is still refused by Gatekeeper on download, so the two belong together.
dmg:
  sign: true
